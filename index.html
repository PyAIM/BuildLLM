<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Build an LLM From Scratch</title>
    <meta name="description" content="A hands-on tutorial series by Moez Ben-Azzouz. Build a Large Language Model from first principles using only Python and NumPy — no PyTorch, no TensorFlow." />
    <meta name="author" content="Moez Ben-Azzouz" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // GitHub Pages SPA redirect — Part 2: RESTORE
      //
      // After 404.html stores the intended path in sessionStorage and redirects
      // here, we restore it using history.replaceState so the React router
      // (wouter) sees the correct path and renders the right page.
      //
      // This must run BEFORE React mounts so the initial route is correct.
      (function () {
        var redirect = sessionStorage.getItem('spa_redirect');
        if (redirect) {
          sessionStorage.removeItem('spa_redirect');
          // BASE_URL is injected by Vite at build time (e.g. "/BuildLLM").
          // In dev it is "/", so this is a no-op in development.
          var base = '/BuildLLM/'.replace(/\/$/, '');
          window.history.replaceState(null, '', base + redirect);
        }
      })();
    </script>
    <script type="module" crossorigin src="/BuildLLM/assets/index-CaTsdtOO.js"></script>
    <link rel="stylesheet" crossorigin href="/BuildLLM/assets/index-DA3EUXDL.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
