<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Build an LLM From Scratch</title>
    <script>
      // GitHub Pages SPA redirect — Part 1: STORE
      //
      // When a user visits a deep link (e.g. /BuildLLM/article/attention),
      // GitHub Pages has no physical file there, so it serves this 404.html.
      // We capture the full path/search/hash, store it in sessionStorage,
      // then redirect to the root index.html which will restore it.
      //
      // The redirect preserves the path after the repo name (/BuildLLM).
      // We encode it as a query string to survive the redirect safely.
      (function () {
        var base = '/BuildLLM';
        var loc = window.location;
        // Build the path relative to the base, e.g. "/article/attention"
        var path = loc.pathname.slice(base.length) || '/';
        var search = loc.search;
        var hash = loc.hash;
        // Store the intended destination
        sessionStorage.setItem('spa_redirect', path + search + hash);
        // Redirect to the root of the app
        loc.replace(base + '/?spa=1');
      })();
    </script>
  </head>
  <body>
    <!-- This page is only served by GitHub Pages for unknown paths.
         The script above immediately redirects to index.html, which
         restores the original route. Users should never see this content. -->
    <p>Redirecting&hellip;</p>
  </body>
</html>
